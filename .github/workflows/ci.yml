# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous ci.yml; every check it ran is kept (Ruff, pytest, wheel contents + console
# script, non-editable install serving the sample data, web typecheck/tests/build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11"
      install-command: uv pip install -e ".[dev,parquet]"
      test-command: |
        python -m pytest -q
        # Wheel contains every package and the sample data; the console script starts.
        uv build --wheel --out-dir "$RUNNER_TEMP/dist" .
        python - "$RUNNER_TEMP/dist" <<'PY'
        import pathlib, sys, zipfile
        wheel = next(pathlib.Path(sys.argv[1]).glob("*.whl"))
        names = set(zipfile.ZipFile(wheel).namelist())
        tops = {name.split("/")[0] for name in names}
        expected = {"reconciliation_core", "migration_data_engine", "migration_input",
                    "migration_privacy", "migration_audit", "migration_validation_api"}
        missing = expected - tops
        assert not missing, f"wheel is missing packages: {sorted(missing)}"
        for sample in ("legacy_customers.csv", "new_customers.csv"):
            assert f"migration_validation_api/sample_data/{sample}" in names, sample
        PY
        migration-workbench --help
        # A non-editable install serves the sample data.
        uv venv "$RUNNER_TEMP/wheel-venv"
        uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl httpx
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
        from fastapi.testclient import TestClient
        from migration_validation_api.server import app
        client = TestClient(app)
        for name in ("legacy_customers.csv", "new_customers.csv"):
            response = client.get(f"/fixtures/{name}")
            assert response.status_code == 200 and response.content, name
        PY

  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      working-directory: apps/web
      node-version: "22"
      lint-command: "" # no Biome/ESLint config yet; tsc and the tests still run
      test-command: npm run test:report
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1

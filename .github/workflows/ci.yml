name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parquet]"
      - name: Lint (pyflakes rules)
        run: ruff check --select F packages connectors apps/api evals run.py
      - name: Tests
        run: python -m pytest -q
      - name: Wheel contains every package; console script starts
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python - "$RUNNER_TEMP/dist" <<'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path(sys.argv[1]).glob("*.whl"))
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          expected = {"reconciliation_core", "migration_data_engine", "migration_input",
                      "migration_privacy", "migration_audit", "migration_validation_api"}
          missing = expected - tops
          assert not missing, f"wheel is missing packages: {sorted(missing)}"
          names = set(zipfile.ZipFile(wheel).namelist())
          for sample in ("legacy_customers.csv", "new_customers.csv"):
              assert f"migration_validation_api/sample_data/{sample}" in names, sample
          PY
          migration-workbench --help
      - name: Non-editable install serves the sample data
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install -q "$RUNNER_TEMP"/dist/*.whl httpx
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from migration_validation_api.server import app
          client = TestClient(app)
          for name in ("legacy_customers.csv", "new_customers.csv"):
              response = client.get(f"/fixtures/{name}")
              assert response.status_code == 200 and response.content, name
          PY

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:report
      - run: npm run build
